<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>High-Tech Clicker Game</title>
 <style>
   body {
     font-family: Arial, sans-serif;
     text-align: center;
     background-color: #282c34;
     color: white;
   }
   #clickButton {
     padding: 20px;
     font-size: 20px;
     background-color: #61dafb;
     border: none;
     border-radius: 10px;
     cursor: pointer;
   }
   #clickButton:hover {
     background-color: #21a1f1;
   }
   .upgrade {
     margin-top: 20px;
   }
   .upgrade button {
     margin: 5px;
     padding: 10px;
     font-size: 16px;
   }
 </style>
</head>
<body>
 <h1>Clicker Game</h1>
 <p>Score: <span id="score">0</span></p>
 <button id="clickButton">Click Me!</button>
 <div class="upgrade">
   <h2>Upgrades</h2>
   <button id="upgrade1" data-cost="10" data-value="1">+1 Click (Cost: 10)</button>
   <button id="upgrade2" data-cost="50" data-value="5">+5 Clicks (Cost: 50)</button>
 </div>
 <script>
   let score = 0;
   let clickValue = 1;
   const scoreDisplay = document.getElementById('score');
   const clickButton = document.getElementById('clickButton');
   const upgrades = document.querySelectorAll('.upgrade button');
   clickButton.addEventListener('click', () => {
     score += clickValue;
     updateScore();
   });
   upgrades.forEach(button => {
     button.addEventListener('click', () => {
       const cost = parseInt(button.getAttribute('data-cost'));
       const value = parseInt(button.getAttribute('data-value'));
       if (score >= cost) {
         score -= cost;
         clickValue += value;
         button.setAttribute('data-cost', cost * 2);
         button.textContent = `+${value} Clicks (Cost: ${cost * 2})`;
         updateScore();
       }
     });
   });
   function updateScore() {
     scoreDisplay.textContent = score;
     upgrades.forEach(button => {
       const cost = parseInt(button.getAttribute('data-cost'));
       button.disabled = score < cost;
     });
   }
   updateScore();
 </script>
</body>
</html>
